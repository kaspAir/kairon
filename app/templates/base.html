<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}KAIRON{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/kairon.css') }}">
</head>
<body>
  <div class="app-shell">
    <header class="header">
      <a class="brand" href="{{ url_for('ui.home') }}" aria-label="KAIRON Home">
        <img class="logo-mark" src="{{ url_for('static', filename='img/kairon-logo.jpg') }}" alt="KAIRON / Sophilius Logo">
        <span>
          <span class="brand-title">KAIRON</span><br>
          <span class="brand-subtitle">Decision Intelligence Workspace</span>
        </span>
      </a>
      <nav class="nav" aria-label="Hauptnavigation">
        <a class="{{ 'active' if active_nav == 'decisions' else '' }}" href="{{ url_for('ui.home') }}">Decisions</a>
        <a class="{{ 'active' if active_nav == 'processes' else '' }}" href="{{ url_for('ui.process_landscape') }}">Process Landscape</a>
        <a class="{{ 'active' if active_nav == 'scenarios' else '' }}" href="{{ url_for('ui.scenarios_overview') }}">Scenarios</a>
        <a class="{{ 'active' if active_nav == 'compare' else '' }}" href="{{ url_for('ui.compare_overview') }}">Compare</a>
        <a class="{{ 'active' if active_nav == 'governance' else '' }}" href="{{ url_for('ui.governance_overview') }}">Governance</a>
        <a class="{{ 'active' if active_nav == 'analytics' else '' }}" href="{{ url_for('ui.analytics_overview') }}">Analytics</a>
        <a class="{{ 'active' if active_nav == 'system' else '' }}" href="{{ url_for('ui.system_status') }}">System Status</a>
        <a href="{{ url_for('api.index') }}">API</a>
      </nav>
    </header>
    <main class="container">
      {% if message %}
        <div class="message {{ message.level }}">{{ message.text }}</div>
      {% endif %}
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
